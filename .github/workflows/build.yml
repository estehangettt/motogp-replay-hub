name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Pastikan keystore ada
        run: test -f android/app/debug.keystore

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Beri nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "ReplayHubPro-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ReplayHubPro-apk
          path: ReplayHubPro-*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Replay Hub Pro 1.0.${{ github.run_number }}
          files: ReplayHubPro-*.apk
