plugins {
    id "com.android.application"
}

android {
    namespace "com.estehangettt.motogpreplayhub"
    compileSdk 35

    defaultConfig {
        applicationId "com.estehangettt.motogpreplayhub"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            def debugStore = System.getenv("ANDROID_DEBUG_KEYSTORE")
            if (debugStore) {
                storeFile file(debugStore)
                storePassword System.getenv("ANDROID_DEBUG_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_DEBUG_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_DEBUG_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
