plugins {
    id "com.android.application"
}

// Nomor build dari GitHub Actions, selalu naik di setiap push.
def buildNumber = (System.getenv("VERSION_CODE") ?: "1").toInteger()

android {
    namespace "com.estehangettt.motogpreplayhub"
    compileSdk 34

    defaultConfig {
        applicationId "com.estehangettt.motogpreplayhub"
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    // Keystore disimpan di repo agar tanda tangan APK selalu sama.
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
